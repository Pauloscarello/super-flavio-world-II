porcionais às horas trabalhadas. Ele se declarou contra o fim obrigatório da 6x1, que 71% dos brasileiros apoiam (Datafolha). Mais horas na mão do patrão — e menos dinheiro no bolso: no governo do pai, o salário mínimo ainda ficou sem aumento real nos 4 anos.`,morte:`"Banco de horas zerado!" / "Seu 13º virou 13 reais."`,cut:`Plenário do Senado. Flávio assina com uma caneta gigante a "PEC DO HORÁRIO FLEXÍVEL". Quando ele carimba, o relógio da torre lá fora começa a girar sozinho e sai andando. Flávio, para a câmera: "Agora quem decide o seu horário é o patrão."`},2:{adverte:`Banco Central adverte: Flávio faz mal para o seu bolso`,nome:`A Barraca da Dona Neide`,area:`Economia / Pix`,quem:`Dona Neide, 58, pasteleira`,missao:`O Pix é o que mantém a barraca de pé: sem taxa, sem maquininha. Mas o novo presidente prometeu aos EUA que o Pix ia parar de "atrapalhar". Venda 20 pastéis. Caiu adesivo de TAXA no QR code do cliente? Chegue perto e aperte X pra arrancar antes de vender.`,va:`VOCÊ ARRANCOU OS ADESIVOS… mas a maquininha que Flávio prometeu aos americanos já ficou instalada. A barraca fecha com dois pastéis a menos a cada 100. No rádio da feira: "Flávio garante: o Pix continua… com taxinha".`,real:`Em junho de 2026, o governo Trump concluiu que o Pix prejudica empresas americanas — e apontou como "prática desleal" justamente a gratuidade e o teto de tarifa. Em julho, Flávio mandou aos EUA um relatório de 86 páginas oferecendo um "compromisso legislativo" sobre o Pix e pedindo redução de ônus para operadoras de cartão de crédito. Em 2025, ele agradeceu a Trump pela tarifa de 50% sobre o Brasil.`,morte:`"Pix taxado!" / "Essa transação custou um pastel."`,cut:`Salão oval escuro. Flávio entrega ao Tio Sam um envelope gordo com "PIX" escrito. O Tio Sam pega um carimbo "TAXA" e bate num QR code gigante do Pix, que racha. Flávio faz joinha: "Thank you!"`},3:{adverte:`Min. da Saúde adverte: Flávio faz mal para a saúde`,nome:`Plantão no Postinho`,area:`Saúde`,quem:`Dona Cida, 71, hipertensa`,missao:`O remédio de pressão da Dona Cida é de graça na Farmácia Popular. Mas o presidente passou a tesoura no piso da saúde, e o chão do postinho está desabando. Suba até a farmácia antes que ele caia. Desvie das tesouras. Segure X para correr.`,va:`DONA CIDA CHEGOU AO BALCÃO. "Esse saiu da lista depois do tesouraço do Flávio, senhora: R$ 89,90." Ela leva meia caixa e divide o comprimido.`,real:`O plano de Flávio promete um "tesouraço" nos gastos sem dizer o que corta, e a equipe estudou acabar com os pisos de saúde e educação. No governo do pai, a proposta de Orçamento de 2023 cortava 59% da Farmácia Popular — e Jair vetou a distribuição gratuita de absorventes. Hoje, 41 itens do programa são gratuitos.`,morte:`"Remédio esgotado." / "Volte com R$ 89,90."`,cut:`Gabinete. Flávio pega uma tesoura gigante gravada "TESOURAÇO" e corta uma faixa vermelha escrita "PISO DA SAÚDE". Corte para o postinho: o chão do prédio racha de ponta a ponta.`},4:{adverte:`Min. do Meio Ambiente adverte: Flávio faz mal para a Amazônia`,nome:`Fumaça`,area:`Meio ambiente`,quem:`Raimundo, 34, brigadista`,missao:`O presidente acabou com as "amarras ambientais": licença atrasada agora vale como aprovada. Pegue as mudas e plante nas 5 clareiras antes de chegar ao rio. Desvie do fogo e das motosserras. Ouviu o sininho? Suba: lá vem a boiada.`,va:`TODAS NEGADAS! Mas pela regra de Flávio, licença atrasada é aprovada: enquanto você carimbava aqui, 30 pedidos venceram o prazo em outros guichês. Ao fundo, 30 motosserras ligam ao mesmo tempo. Do alto do morro, Raimundo só vê pasto.`,real:`No governo do pai, o desmatamento na Amazônia subiu 60% e 2021 foi o pior ano em 15 anos; o ministro falava em "passar a boiada". Flávio votou a favor do projeto de licenciamento chamado de "PL da devastação" e, em outubro de 2026, prometeu "acabar com essas amarras ambientais". O plano dele prevê que a licença seja concedida se o Estado perder o prazo. Desse jeito, não vai sobrar Amazônia no Brasil.`,morte:`"Licença aprovada por decurso de prazo." / "Mais uma árvore no chão."`,cut:`Palanque no meio da floresta. Flávio grita "Vamos acabar com essas amarras ambientais!" e arrebenta uma corrente com as mãos. A corrente cai e, atrás dele, sai uma boiada e um bando de motosserras correndo mata adentro.`},5:{adverte:`Min. da Justiça adverte: Flávio faz mal para a sua segurança`,nome:`Território`,area:`Segurança / Milícia`,quem:`Kauã, 19, entregador de delivery de bike, com a bag vermelha nas costas`,missao:`Pra entregar no bairro, o Kauã tem que passar pelos cobradores da milícia. Se a lanterna te pegar, é taxa. Segure X atrás de uma caixa d'água ou muro para se esconder. Faça as 5 entregas — a comida não pode esfriar na bag.`,va:`ARMA TRAVADA! No dia seguinte, outro capitão assume o ponto — com munição nova comprada como CAC e a mesma Medalha Tiradentes, assinada "dep. Flávio Bolsonaro". A taxa do gás subiu, e a comida esfriou na bag.`,real:`Em 2007, na Alerj, Flávio disse que "não se pode estigmatizar as milícias". Deu a Medalha Tiradentes a Adriano da Nóbrega, chefe do Escritório do Crime, quando ele estava preso; a mãe e a mulher de Adriano trabalharam no gabinete dele. Homenageou o major Ronald, condenado em 2026 pela morte de Marielle. Em 2023, mandou emenda pedida por outro condenado no caso. No governo do pai, as armas de CACs passaram de 350 mil para 1 milhão, e parte foi parar no crime. Em 2022, último ano do governo do pai, o Brasil teve 39,8 mil homicídios e latrocínios. Em 2025, esse número CAIU para 32,3 mil.`,morte:`"Taxa de proteção vencida." / "Bala de CAC: comprada legalmente, usada como sempre."`,cut:`Alerj, 2007, em pixel sépia. Flávio na tribuna prende uma medalha no peito de um homem fardado e diz no microfone: "Não se pode, simplesmente, estigmatizar as milícias." O homem sai da sala, coloca um boné e vira o Capitão.`},6:{adverte:`INSS adverte: Flávio faz mal para a sua aposentadoria`,nome:`A Fila do INSS`,area:`Previdência`,quem:`Seu Arlindo, 66, aposentado`,missao:`Seu Arlindo só quer receber a aposentadoria inteira. Mas o fio que ligava o benefício ao salário mínimo foi puxado, e tem envelope de desconto voando pra todo lado. Z duas vezes = pulo duplo com a bengala. X = bengalada para se livrar dos descontos. Chegue ao guichê.`,va:`FIO RECONECTADO! Mas o reajuste de Flávio chega no contracheque: só inflação. E mais um desconto que Seu Arlindo nunca autorizou — vindo da Sala do Careca, a mesma da empresa do presidente. As luzes continuam acesas.`,real:`Segundo a Folha, a equipe de Flávio estudou corrigir aposentadorias e BPC só pela inflação, tirando o aumento real do salário mínimo — a Consultoria da Câmara calcula que isso tiraria R$ 1,1 trilhão em 10 anos. Ele votou na reforma de 2019 que fez o benefício começar em 60% da média. E está ligado ao escândalo do INSS: uma empresa dele é registrada na mesma sala que 16 empresas do "Careca do INSS". O esquema de descontos indevidos atingiu até 6 milhões de aposentados.`,morte:`"Benefício desvinculado." / "Desconto não autorizado: -R$ 45,00."`,cut:`Sala comercial com a placa "SALA DO CARECA". Flávio puxa da tomada um fio escrito "SALÁRIO MÍNIMO" que vai até o prédio do INSS. Atrás dele, um careca carimba envelopes "DESCONTO" sem parar.`},7:{adverte:`TSE adverte: Flávio faz mal para a democracia`,nome:`Praça dos Três Poderes`,area:`Democracia (final)`,quem:`O jogador escolhe 1 dos 6 personagens (cada um mantém a ação X da sua fase)`,missao:`Os três que saíram da cadeia estão na Praça. O presidente quer maioria para "mudar a Constituição". Escolha quem vai, atravesse a Praça e chegue à urna.`,va:`VOCÊ DERROTOU FLÁVIO… no jogo. Ele se levanta, ajeita a faixa e sorri: "Aqui foi fácil. Na vida real, eu só perco de um jeito." A tela vira a urna: o voto é o golpe final — e a única vitória que não vira derrota.`,real:`Flávio prometeu anistia para o pai, condenado a 27 anos por tentativa de golpe, "ainda na transição" — e indulto "para todo mundo" se a anistia não passar. Defendeu impeachment de ministros do STF e disse querer maioria no Congresso "para mudar a Constituição".`,morte:`"Constituição queimada."`,cut:`Praça ao entardecer. Flávio, de faixa, entre o pai (uniforme listrado) e o Banqueiro (mala "PARA O FILME"). Ele ergue a Constituição, risca um fósforo e põe fogo nela: "Com maioria no Congresso, vamos mudar a Constituição." As páginas em chamas voam pela Praça.`},placar:[[`Plano para agradar ao Trump`,`Taxar o Pix`],[`Aposentadoria com aumento real`,`Cancelada`],[`Mentiras sobre o banqueiro do Master`,`43`],[`Plano para a floresta`,`Motosserra`],[`Leis de segurança aprovadas`,`0`],[`Medalhas para miliciano preso`,`1`],[`Endereço em comum com o Careca do INSS`,`1 sala`],[`Folga para o trabalhador`,`só 1 dia`]],urna:{title:`O fim desse jogo é você quem escolhe`,body:`Nesta eleição, não está em jogo só um governo. Está em jogo a soberania do Brasil, que não se negocia com outro país em troca de favor. Está em jogo a democracia, que não se queima numa praça. E está em jogo a garantia de que, daqui a 4 anos, você vai poder voltar aqui e votar de novo. Ninguém precisa concordar com tudo para saber qual caminho é pior. Às vezes, votar é escolher o caminho menos pior. E esse caminho não passa por Flávio. No segundo turno, no próximo dia 25, diga não a Flávio Bolsonaro. Diga sim ao Brasil.`}},ze={busao:{sky:[`#140c22`,`#4a2e4e`],top:`#4a4a4e`,fill:`#2a2230`,dot:`#1e1824`,brick:`#4a2a34`,block:`#3a3040`,plat:`#7a5a6a`},feira:{sky:[`#1e140e`,`#6a5236`],top:`#6a5a3a`,fill:`#3a2c20`,dot:`#2c2018`,brick:`#5a3a2a`,block:`#4a3a2c`,plat:`#8a6a4a`},postinho:{sky:[`#06100c`,`#1c3a2e`],top:`#5a7a6a`,fill:`#24302c`,dot:`#1a2420`,brick:`#2e4a40`,block:`#3a4a44`,plat:`#8ab0a0`},fumaca:{sky:[`#1e0804`,`#8a3a12`],top:`#3a2a1a`,fill:`#1e120c`,dot:`#140c08`,brick:`#4a2a1a`,block:`#3a2418`,plat:`#6a4a2a`},territorio:{sky:[`#0e1230`,`#3a2c58`],top:`#5a5060`,fill:`#2e2834`,dot:`#241f2a`,brick:`#6a3a2a`,block:`#4a3a40`,plat:`#6a5a70`},inss:{sky:[`
